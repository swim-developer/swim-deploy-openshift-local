{{- if .Values.backend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-backend-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.labels | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  # Kafka Configuration
  KAFKA_BOOTSTRAP_SERVERS: "{{ .Values.kafka.serviceName }}.{{ .Values.swimNamespace }}.svc.cluster.local:{{ .Values.kafka.port }}"
  ED254_ARRIVAL_SEQUENCE_TOPIC: {{ .Values.kafka.topics.arrivalSequence }}
  ED254_EXCEPTION_TOPIC: {{ .Values.kafka.topics.providerException }}
  ED254_CONSUMER_GROUP: {{ .Values.kafka.consumerGroup }}

  # ED254 Consumer URL
  ED254_CONSUMER_URL: "http://{{ .Values.ed254Consumer.serviceName }}.{{ .Values.swimNamespace }}.svc.cluster.local:{{ .Values.ed254Consumer.port }}"

  # Application Configuration
  OTEL_SDK_DISABLED: "true"
  QUARKUS_LOG_LEVEL: {{ .Values.backend.env.logLevel }}
  JAVA_OPTS: {{ .Values.backend.env.javaOpts }}
{{- end }}
