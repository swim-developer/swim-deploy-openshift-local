{{- if .Values.backend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.appName }}-backend-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- toYaml .Values.labels | nindent 4 }}
    app.kubernetes.io/component: backend
data:
  KAFKA_BOOTSTRAP_SERVERS: "{{ .Values.kafka.serviceName }}.{{ .Values.swimNamespace }}.svc.cluster.local:{{ .Values.kafka.port }}"
  ED254_SEQUENCE_TOPIC: {{ .Values.kafka.topics.arrivalSequence }}
  ED254_EXCEPTION_TOPIC: {{ .Values.kafka.topics.providerException }}
  ED254_PROVIDER_URL: "http://{{ .Values.ed254Provider.serviceName }}.{{ .Values.swimNamespace }}.svc.cluster.local:{{ .Values.ed254Provider.internalPort }}"
  ED254_CONSUMER_GROUP: "ed254-aman-client"
  CORS_ORIGINS: "*"
  OTEL_SDK_DISABLED: "true"
  QUARKUS_LOG_LEVEL: {{ .Values.backend.env.logLevel }}
  JAVA_OPTS: {{ .Values.backend.env.javaOpts }}
{{- end }}
