namespace: swim-demo
appName: dnotam-event-publisher

swimNamespace: swim-demo

backend:
  enabled: true
  image:
    repository: quay.io/masales/dnotam-event-publisher-backend
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 8092
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    javaOpts: "-Xmx768m -XX:+UseParallelGC"
    logLevel: "INFO"
  livenessProbe:
    path: /q/health/live
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    path: /q/health/ready
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

frontend:
  enabled: true
  image:
    repository: quay.io/masales/dnotam-event-publisher-frontend
    tag: latest
    pullPolicy: Always
  replicas: 1
  port: 8080
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "64Mi"
      cpu: "100m"
  route:
    enabled: true
    host: dnotam-event-publisher.apps-crc.testing
    tls:
      enabled: true
      termination: edge
      insecureEdgeTerminationPolicy: Redirect

provider:
  serviceName: swim-dnotam-provider-internal
  internalPort: 9080

kafka:
  serviceName: kafka-kafka-bootstrap
  port: 9092
  topic: dnotam-events-all-topic

labels:
  app.kubernetes.io/name: dnotam-event-publisher
  app.kubernetes.io/instance: dnotam-event-publisher
  app.kubernetes.io/part-of: swim-framework
  app.kubernetes.io/component: example-app
  app.kubernetes.io/managed-by: helm
